<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Consignment Kush">
  <!-- The sidebar mark, at icon size: the lucide "cannabis" glyph on the brand
       square. Same shape, same colour, so the tab and the home screen agree
       with what the app looks like once it opens.

       This file is the source of truth for every icon in the app. The PNGs in
       public/ and apple-icon.png are renders of it at fixed sizes, which
       Android and iOS require; regenerate them from here if the mark changes. -->
