<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pondex">
  <!-- The sidebar mark, at icon size: the Pondex mark on the brand square. Same
       shape, same colour, so the tab and the home screen agree with what the
       app looks like once it opens.

       This file is the source of truth for every icon in the app. The PNGs in
       public/ and apple-icon.png are renders of it at fixed sizes, which
       Android and iOS require; regenerate them from here if the mark changes.

       #14418c is the brand variable from globals.css in hex. The mark is drawn on a 100
       grid, matched to components/shell/pondex-mark.tsx, then scaled to sit on
       a 240px square centred in the 512 — roomy enough that the shape survives
       being shown at 32px in a browser tab. -->
  <rect width="512" height="512" rx="114" fill="#14418c"/>
  <g transform="translate(136 136) scale(2.4)" fill="#fcfcfc">
    <rect x="0" y="0" width="39" height="100"/>
    <rect x="45" y="0" width="55" height="30"/>
    <rect x="45" y="36" width="55" height="64"/>
  </g>
</svg>
